<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Withdraw Money - SecureBank</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial;
        background: #07111f;
        color: #eef6ff;
      }
      .nav {
        height: 70px;
        background: #0d1b2e;
        padding: 0 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #35d0ba;
      }
      .nav a {
        color: white;
        text-decoration: none;
      }
      .container {
        width: 90%;
        max-width: 550px;
        margin: 50px auto;
      }
      .box {
        background: #0d1b2e;
        padding: 35px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        margin-bottom: 25px;
      }
      .balance {
        background: #10233a;
        padding: 18px;
        border-radius: 10px;
        margin-bottom: 20px;
        color: #35d0ba;
      }
      label {
        display: block;
        margin: 15px 0 7px;
        color: #91a4ba;
      }
      input {
        width: 100%;
        padding: 14px;
        background: #10233a;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: 0;
        border-radius: 9px;
        background: #35d0ba;
        font-weight: bold;
        cursor: pointer;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #91a4ba;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    
<script> if (!localStorage.getItem("jwtToken")) {
    window.location.replace("user-login.html");
}

window.addEventListener("pageshow", function () {
    if (!localStorage.getItem("jwtToken")) {
        window.location.replace("user-login.html");
    }
});</script>


    <nav class="nav">
      <div class="logo">SecureBank</div>
      <a href="user-dashboard.html">Dashboard</a>
    </nav>

    <div class="container">
      <div class="box">
        <h1>💳 Withdraw Money</h1>

        <div class="balance">
          Available Balance: ₹ <span id="balance"></span>
        </div>

        <form onsubmit="withdraw(event)">
          <label>Amount</label>
          <input
            id="amount"
            type="number"
            min="1"
            placeholder="Enter amount"
            required
          />

          <label>Transaction PIN</label>
          <input
            type="password"
            id="pin"
            maxlength="6"
            placeholder="Enter PIN"
            required
          />

          <button>Withdraw Money</button>
        </form>

        <a href="user-dashboard.html" class="back"> ← Back to Dashboard </a>
      </div>
    </div>
    <script src="app.js"></script>
    <script>
      
      const userData = JSON.parse(localStorage.getItem("userData"));
      const balance = userData.balance;
      document.getElementById("balance").innerText = balance.toLocaleString();
      function withdraw(e) {
        e.preventDefault();

        const amount = Number(document.getElementById("amount").value);
        const PIN = document.getElementById("pin").value;
        console.log(balance);

        if (amount <= 0) {
          alert("Enter valid amount");
          return;
        }

        if (amount > balance) {
          alert("Insufficient balance!");
          return;
        }
        if (pin.length < 4) {
          alert("Enter Valid PIN");
          return;
        } else {
          withdrawBalanceFromUser(userData.accountNumber, amount, PIN);
        }
      }
    </script>
  </body>
</html>
