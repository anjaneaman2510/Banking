<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Transfer Money - SecureBank</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial;
        background: #07111f;
        color: #eef6ff;
      }
      .nav {
        height: 70px;
        background: #0d1b2e;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 7%;
      }
      .logo {
        color: #35d0ba;
        font-size: 24px;
        font-weight: bold;
      }
      .nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
      }
      .container {
        width: 90%;
        max-width: 550px;
        margin: 50px auto;
      }
      .box {
        background: #0d1b2e;
        padding: 35px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        margin-bottom: 25px;
      }
      label {
        display: block;
        margin: 16px 0 7px;
        color: #91a4ba;
      }
      input {
        width: 100%;
        padding: 14px;
        background: #10233a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9px;
        color: white;
        outline: none;
      }
      input:focus {
        border-color: #35d0ba;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: 0;
        border-radius: 9px;
        background: #35d0ba;
        font-weight: bold;
        cursor: pointer;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: #91a4ba;
        text-decoration: none;
      }
    </style>
  </head>

  <body>

    
<script> if (!localStorage.getItem("jwtToken")) {
    window.location.replace("user-login.html");
}

window.addEventListener("pageshow", function () {
    if (!localStorage.getItem("jwtToken")) {
        window.location.replace("user-login.html");
    }
});</script>


    <nav class="nav">
      <div class="logo">SecureBank</div>
      <a href="user-dashboard.html">Dashboard</a>
    </nav>

    <div class="container">
      <div class="box">
        <h1>💸 Transfer Money</h1>

        <form onsubmit="transfer(event)">
          <label>Receiver Account Number</label>
          <input
            id="account"
            type="text"
            placeholder="Enter account number"
            required
          />

          <label>Amount</label>
          <input
            id="amount"
            type="number"
            placeholder="Enter amount"
            min="1"
            required
          />

          <label>Transfer Description</label>
          <input
            id="description"
            type="text"
            placeholder="e.g. Personal transfer"
          />

          <label>Transaction PIN</label>
          <input
            id="pin"
            type="password"
            maxlength="6"
            placeholder="Enter PIN"
            required
          />

          <button type="submit">Transfer Money</button>
        </form>

        <a class="back" href="user-dashboard.html">← Back to Dashboard</a>
      </div>
    </div>
    <script src="app.js"></script>
    <script>
      
      function transfer(event) {
        event.preventDefault();

        const amount = document.getElementById("amount").value;
        const receverAccount = document.getElementById("account").value;
        const description = document.getElementById("description").value;
        const PIN = document.getElementById("pin").value;
        if (amount <= 0) {
          alert("Enter valid amount");
          return;
        } else if (PIN.length < 4) {
          alert("Enter Valid PIN ");
          return;
        } else if (receverAccount.length <= 10) {
          alert("Enter Valid Account Number ");
          return;
        } else if (description.length === 0) {
          alert("Please add Description");
          return;
        } else {
          transferToAnother(receverAccount, amount, description, PIN);
        }
      }
    </script>
  </body>
</html>
